version: 2

project_name: forgejo-mirror-sync

before:
  hooks:
    - go mod download

builds:
  - main: ./cmd/forgejo-mirror-sync
    env:
      - CGO_ENABLED=0
    # Run by hand on whatever machine has `gh` and `tea` set up — so the
    # native-binary matrix covers where that actually is, not just linux.
    # The Docker image below is the separate, container-shaped path;
    # it bundles its own gh/tea rather than assuming the host has them.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # The version the binary reports comes from the tag, so `--version`
    # can be asked without going back to CI to look it up.
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# linux/amd64 only: the Dockerfile bundles pinned gh/tea binaries for that
# one architecture. arm64 is a real gap, not an oversight — see the
# Dockerfile's own comment and the repo's issue tracker.
dockers:
  - image_templates:
      - "ghcr.io/alrayyes/forgejo-mirror-sync:{{ .Tag }}"
      - "ghcr.io/alrayyes/forgejo-mirror-sync:latest"
    dockerfile: Dockerfile
    goos: linux
    goarch: amd64

# release-please already wrote the notes, curated from the same commits, and
# created the release carrying them. A second shortlog generated here would
# put them on twice, and `release.mode: replace` would throw the curated copy
# away — so the changelog is off and `release.mode` stays at its default,
# keep-existing. goreleaser is only hanging binaries on a release that exists.
changelog:
  disable: true
