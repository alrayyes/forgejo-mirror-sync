version: 2

project_name: forgejo-mirror-sync

before:
  hooks:
    - go mod download

builds:
  - main: ./cmd/forgejo-mirror-sync
    env:
      - CGO_ENABLED=0
    # Run by hand on whatever machine has `gh` and `tea` set up, not in a
    # container — so the matrix covers where that actually is, not just
    # linux.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # The version the binary reports comes from the tag, so `--version`
    # can be asked without going back to CI to look it up.
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# release-please already wrote the notes, curated from the same commits, and
# created the release carrying them. A second shortlog generated here would
# put them on twice, and `release.mode: replace` would throw the curated copy
# away — so the changelog is off and `release.mode` stays at its default,
# keep-existing. goreleaser is only hanging binaries on a release that exists.
changelog:
  disable: true
